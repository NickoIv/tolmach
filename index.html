<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143830">
<title>Толмач — голосовой переводчик: русский, английский, китайский, вьетнамский, тайский, казахский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2420; --pine:#143830; --paper:#F1F5F2; --card:#FFFFFF;
  --teal:#0FA383; --teal-soft:#E2F4EE; --gold:#F2B33D; --gold-soft:#FCEFD4;
  --line:rgba(15,36,32,.10); --mut:#5C6F69; --red:#D64545;
  --tx:#0F2420; --ph:#A9BAB3; --fs:1;
}
html[data-font="s"]{--fs:.88}
html[data-font="l"]{--fs:1.16}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{margin:0; padding:0;}
body{
  font-family:'Golos Text',system-ui,sans-serif; color:var(--tx);
  background:linear-gradient(165deg,#F3F7F4 0%,#EAF1ED 55%,#F4F1E7 100%);
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(60% 45% at 8% 0%, rgba(15,163,131,.10), transparent 70%),
    radial-gradient(55% 40% at 100% 100%, rgba(242,179,61,.12), transparent 70%);
}
/* ---------- ТЁМНАЯ ТЕМА ---------- */
[data-theme="dark"]{
  --paper:#0B1714; --card:#142A24; --line:rgba(255,255,255,.09);
  --mut:#8CA39A; --tx:#E9F3EE; --ph:#6B8279;
  --teal:#2EC7A4; --teal-soft:rgba(46,199,164,.13);
  --gold:#F6C463; --gold-soft:rgba(246,196,99,.13);
  --red:#F07575;
}
[data-theme="dark"] body{background:linear-gradient(165deg,#0C1915 0%,#0A1411 55%,#0E1811 100%);}
[data-theme="dark"] .card{box-shadow:0 10px 24px rgba(0,0,0,.35);}
[data-theme="dark"] .result-card{background:linear-gradient(180deg,#142A24,#122621);}
[data-theme="dark"] .result-card.gold{background:linear-gradient(180deg,#142A24,#1B2A1E);}
[data-theme="dark"] .live-area{background:#10231E;}
[data-theme="dark"] .icon-btn,[data-theme="dark"] .chip{background:#1A332C;}
[data-theme="dark"] .v-entry{background:#17302A;}
[data-theme="dark"] .hist-item{background:#142A24;}
[data-theme="dark"] .sheet{background:#16302A; box-shadow:0 -18px 50px rgba(0,0,0,.6);}
[data-theme="dark"] .sheet-close,[data-theme="dark"] .seg,[data-theme="dark"] .set-author{background:#10231E;}
[data-theme="dark"] .sheet-handle{background:#2E4A41;}
[data-theme="dark"] .kbd-done{background:#0A1512; box-shadow:0 12px 28px rgba(0,0,0,.6);}
[data-theme="dark"] .bar{background:#1E3831;}
[data-theme="dark"] .mic{box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 16px 32px rgba(0,0,0,.55);}
[data-theme="dark"] .tabs{box-shadow:0 8px 20px rgba(0,0,0,.3);}
[data-theme="dark"] .top{box-shadow:0 18px 40px rgba(0,0,0,.45);}
[data-theme="dark"] .sel-pop{box-shadow:0 18px 44px rgba(0,0,0,.55);}
[data-theme="dark"] .secwarn{background:linear-gradient(150deg,#3a2a10,#2a1d0a); border-color:rgba(246,196,99,.4);}
/* ---------- каркас ---------- */
.app{position:relative; z-index:1; max-width:460px; margin:0 auto; padding:14px 14px 44px;}
/* ---------- шапка ---------- */
.top{
  background:linear-gradient(150deg,#1A4038,#0E241F); border-radius:22px;
  padding:16px; color:#fff; position:relative; overflow:hidden;
  box-shadow:0 18px 40px rgba(15,36,32,.28);
}
.top::before{
  content:'语言 تىل'; position:absolute; right:-10px; top:-24px; font-weight:800; font-size:80px;
  color:rgba(255,255,255,.045); transform:rotate(8deg); pointer-events:none; white-space:nowrap;
}
.brand{display:flex; align-items:center; gap:12px; position:relative;}
.logo{
  width:46px; height:46px; border-radius:13px; background:var(--gold); color:var(--ink);
  display:grid; place-items:center; flex:0 0 auto;
  box-shadow:0 6px 14px rgba(0,0,0,.3), inset 0 -3px 0 rgba(0,0,0,.15);
}
.name{font-family:'Unbounded'; font-weight:800; font-size:24px; letter-spacing:.06em;}
.tag{font-size:11.5px; color:#AFC9BF; letter-spacing:.05em; margin-top:2px;}
.net{
  margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
  padding:5px 10px; border-radius:999px; color:#D8E7E0;
}
.gear{
  width:34px; height:34px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.08); color:#D8E7E0; display:grid; place-items:center;
  cursor:pointer; transition:background .25s, transform .15s; margin-left:8px; flex:0 0 auto;
}
.gear:hover{background:rgba(255,255,255,.18);}
.gear:active{transform:scale(.88);}
.dot{width:7px; height:7px; border-radius:50%; background:#4ADE80; box-shadow:0 0 8px #4ADE80; animation:pulseDot 2s infinite;}
.net.off .dot{background:#F87171; box-shadow:0 0 8px #F87171;}
@keyframes pulseDot{0%,100%{transform:scale(1);}50%{transform:scale(.7);}}
/* ---------- баннер безопасности (только при запуске с диска) ---------- */
.secwarn{
  margin-top:12px; display:flex; gap:12px; align-items:flex-start;
  background:linear-gradient(150deg,#fff7e6,#fdeecb); border:1px solid rgba(242,179,61,.5);
  border-left:4px solid var(--gold); border-radius:16px; padding:13px 14px;
  box-shadow:0 10px 24px rgba(15,36,32,.10); animation:rise .4s ease both;
}
.secwarn-ic{
  flex:0 0 auto; width:34px; height:34px; border-radius:10px; background:var(--gold); color:#241A06;
  display:grid; place-items:center; box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
}
.secwarn-body{flex:1; min-width:0;}
.secwarn-t{font:700 13.5px/1.3 'Golos Text',system-ui,sans-serif; color:#5a3d06;}
.secwarn-x{font-size:calc(12.5px * var(--fs))/1.45; color:#7a5a16; margin-top:3px;}
.secwarn-a{
  display:inline-flex; align-items:center; gap:6px; margin-top:9px;
  background:#241A06; color:var(--gold); border:0; border-radius:999px; padding:8px 15px;
  font:700 12.5px 'Golos Text',system-ui,sans-serif; cursor:pointer; text-decoration:none;
  transition:transform .15s, opacity .2s;
}
.secwarn-a:hover{opacity:.9;}
.secwarn-a:active{transform:scale(.95);}
.secwarn-close{flex:0 0 auto; border:0; background:none; color:#9a7320; cursor:pointer; padding:2px; display:grid; place-items:center;}
/* ---------- липкая панель управления ---------- */
.sentinel{height:1px;}
.controls{
  position:sticky; top:8px; z-index:40;
  display:flex; flex-direction:column; gap:10px; margin-top:14px;
}
.deck{
  display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end;
  background:linear-gradient(150deg,#1A4038,#0E241F); border-radius:18px; padding:12px;
  box-shadow:0 10px 24px rgba(15,36,32,.22); transition:box-shadow .3s;
}
.controls.stuck .deck{box-shadow:0 18px 38px rgba(15,36,32,.42);}
.lang-label{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:.16em; color:#93B2A7; margin-bottom:5px;}
.lang-side.right{text-align:right;}
.lang-pill{
  width:100%; border:1px solid transparent; border-radius:13px; padding:11px 8px;
  font:800 14.5px/1.2 'Golos Text',system-ui,sans-serif; cursor:pointer; transition:transform .2s;
}
.lang-pill.from{background:var(--gold); color:#241A06; box-shadow:0 6px 14px rgba(242,179,61,.30);}
.lang-pill.to{background:var(--teal); color:#04231A; box-shadow:0 6px 14px rgba(15,163,131,.32);}
.lang-pill:active{transform:scale(.96);}
.lang-pill.pop{animation:pillFade .3s ease;}
@keyframes pillFade{from{opacity:.45;}to{opacity:1;}}
.swap{
  width:44px; height:44px; border-radius:50%; border:0; background:#fff; color:var(--ink);
  display:grid; place-items:center; cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
  transition:transform .45s cubic-bezier(.3,.1,.3,1);
}
.swap:active{transform:scale(.9) rotate(var(--rot,0deg));}
/* ---------- вкладки ---------- */
.tabs{
  position:relative; display:grid; grid-template-columns:repeat(3,1fr);
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:5px;
  box-shadow:0 8px 20px rgba(15,36,32,.07); transition:box-shadow .3s;
}
.controls.stuck .tabs{box-shadow:0 12px 26px rgba(15,36,32,.16);}
.tab{
  position:relative; z-index:1; border:0; background:none; padding:11px 4px; border-radius:12px;
  font:600 13.5px 'Golos Text'; color:var(--mut); display:flex; gap:7px; align-items:center;
  justify-content:center; cursor:pointer; transition:color .25s;
}
.tab.active{color:#fff;}
.tab-glider{
  position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 10px)/3);
  background:var(--ink); border-radius:12px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 4px 12px rgba(15,36,32,.3);
}
/* ---------- панели и карточки ---------- */
.panel{display:none; margin-top:14px;}
.panel.active{display:block; animation:rise .35s ease both;}
@keyframes rise{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:none;}}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px;
  box-shadow:0 10px 24px rgba(15,36,32,.06); margin-bottom:12px;
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
.card-title{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--mut);}
.count{font-size:11px; color:var(--mut); font-variant-numeric:tabular-nums;}
textarea{
  width:100%; border:0; outline:0; resize:none; background:transparent;
  font:500 calc(18px * var(--fs))/1.5 'Golos Text',system-ui,sans-serif; color:var(--tx); min-height:84px;
}
textarea::placeholder{color:var(--ph);}
.input-card{transition:border-color .25s, box-shadow .25s;}
.input-card:focus-within{border-color:rgba(15,163,131,.55); box-shadow:0 0 0 3px rgba(15,163,131,.13);}
.input-card.flash{animation:flashRing .9s ease;}
@keyframes flashRing{
  0%{box-shadow:0 0 0 0 rgba(242,179,61,0);}
  35%{box-shadow:0 0 0 4px rgba(242,179,61,.30); border-color:var(--gold);}
  100%{box-shadow:0 0 0 0 rgba(242,179,61,0);}
}
.card-actions{display:flex; gap:8px; align-items:center;}
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  color:var(--tx); display:grid; place-items:center; cursor:pointer; transition:background .2s, transform .15s;
}
.icon-btn:hover{background:var(--teal-soft); border-color:transparent;}
.icon-btn:active{transform:scale(.9);}
.icon-btn.sm{width:32px; height:32px; border-radius:10px;}
.icon-btn.done{background:var(--teal); color:#fff; border-color:transparent;}
.icon-btn.rec{background:var(--teal); color:#fff; border-color:transparent; animation:recPulse 1.4s infinite;}
@keyframes recPulse{0%{box-shadow:0 0 0 0 rgba(15,163,131,.45);}100%{box-shadow:0 0 0 12px rgba(15,163,131,0);}}
.icon-btn .ic-check{display:none;}
.icon-btn.done .ic-check{display:block;}
.icon-btn.done .ic-main{display:none;}
/* ---------- кнопка «Готово» ---------- */
.kbd-done{
  position:fixed; left:50%; bottom:14px; z-index:60;
  display:flex; align-items:center; gap:8px;
  background:var(--ink); color:#fff; border:0; border-radius:999px;
  padding:12px 22px; font:600 14px 'Golos Text',system-ui,sans-serif; cursor:pointer;
  box-shadow:0 12px 28px rgba(15,36,32,.45);
  opacity:0; pointer-events:none;
  transform:translate(-50%, 90px) translateY(calc(-1 * var(--kb, 0px)));
  transition:transform .35s cubic-bezier(.34,1.3,.64,1), opacity .25s;
}
.kbd-done.show{
  opacity:1; pointer-events:auto;
  transform:translate(-50%, 0) translateY(calc(-1 * var(--kb, 0px)));
}
@media (hover:hover) and (pointer:fine){ .kbd-done{display:none;} }
/* ---------- быстрые фразы ---------- */
.quick{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin-bottom:12px; scrollbar-width:none;}
.quick::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:8px 14px; font:500 calc(13.5px * var(--fs)) 'Golos Text',system-ui,sans-serif; color:var(--tx);
  cursor:pointer; transition:background .2s; animation:rise .3s ease both;
}
.chip:hover{border-color:var(--gold); background:var(--gold-soft);}
/* ---------- результат ---------- */
.result-card{border-left:5px solid var(--teal); background:linear-gradient(180deg,#fff,#F5FBF8); scroll-margin-top:150px;}
.result-card.gold{border-left-color:var(--gold); background:linear-gradient(180deg,#fff,#FFFBF1);}
.result-text{font:600 calc(21px * var(--fs))/1.45 'Golos Text',system-ui,sans-serif; min-height:34px; word-break:break-word;}
.placeholder{color:var(--ph); font-weight:500; font-size:calc(15.5px * var(--fs));}
.pop-r{display:block; animation:pop .3s ease both;}
@keyframes pop{from{opacity:0; transform:translateY(7px);}to{opacity:1; transform:none;}}
.err{color:var(--red); font-size:calc(15px * var(--fs)); font-weight:500;}
.dots i{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--teal); margin-right:5px; animation:blink 1s infinite;}
.dots i:nth-child(2){animation-delay:.2s;} .dots i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,100%{opacity:.2; transform:translateY(0);}50%{opacity:1; transform:translateY(-4px);}}
/* ---------- голос и лента диалога ---------- */
.voice-card{padding:14px;}
.live-area{
  background:#F3F8F5; border:1px solid var(--line); border-radius:14px;
  padding:14px; min-height:112px;
}
.wave{display:flex; gap:4px; align-items:flex-end; height:28px; margin-bottom:10px;}
.wave i{width:4px; height:8px; border-radius:2px; background:var(--teal); opacity:.3; transition:opacity .3s;}
.listening .wave i{opacity:1; animation:eq .9s ease-in-out infinite;}
.wave i:nth-child(2),.wave i:nth-child(6){animation-delay:.12s;}
.wave i:nth-child(3),.wave i:nth-child(5){animation-delay:.24s;}
.wave i:nth-child(4){animation-delay:.36s;}
@keyframes eq{0%,100%{height:8px;}50%{height:26px;}}
.live{font:600 calc(17.5px * var(--fs))/1.45 'Golos Text',system-ui,sans-serif; min-height:26px; text-align:left;}
.live.interim{color:var(--mut); font-style:italic;}
.voice-bottom{display:flex; align-items:center; gap:14px; margin-top:16px;}
.v-info{flex:1; min-width:0;}
.hint{font-size:calc(14px * var(--fs)); color:var(--mut); margin:0; line-height:1.5;}
.mic-note{font-size:calc(12.5px * var(--fs)); color:var(--mut); margin:6px 0 0; transition:color .3s;}
.mic-note.busy{color:var(--teal); font-weight:600;}
.mic{
  flex:0 0 auto; width:88px; height:88px; border-radius:50%; border:0; background:var(--ink);
  color:#fff; display:grid; place-items:center; cursor:pointer; position:relative;
  box-shadow:0 16px 32px rgba(15,36,32,.38); transition:background .3s, transform .2s;
}
.mic:active{transform:scale(.93);}
.mic.listening{background:var(--teal);}
.mic::before,.mic::after{content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--teal); opacity:0; pointer-events:none;}
.mic.listening::before{animation:ring 1.6s ease-out infinite;}
.mic.listening::after{animation:ring 1.6s ease-out .8s infinite;}
@keyframes ring{0%{transform:scale(1); opacity:.7;}100%{transform:scale(1.9); opacity:0;}}
.onair{
  display:inline-flex; align-items:center; gap:5px; font-size:10px; color:var(--red);
  font-weight:700; letter-spacing:.08em; margin-left:8px; vertical-align:middle;
}
.onair i{width:6px; height:6px; border-radius:50%; background:var(--red); animation:pulseDot 1.1s infinite;}
.v-feed{max-height:48vh; overflow-y:auto; display:flex; flex-direction:column; gap:9px; padding-right:2px;}
.feed-empty{color:var(--ph); font-size:calc(15px * var(--fs)); text-align:center; padding:18px 10px; margin:0; line-height:1.5;}
.v-entry{
  border:1px solid var(--line); border-left:4px
